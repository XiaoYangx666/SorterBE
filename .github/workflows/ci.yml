name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check sort tables
        run: bun run tools:check

      # bepack 的类型检查走 `bun check`（见 bepack.config.ts）
      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Pack
        run: bun run pack

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sorter-be-mcpack
          path: dist/*.mcpack
          if-no-files-found: error
          retention-days: 7
