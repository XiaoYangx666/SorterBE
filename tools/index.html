<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>MC 物品分类整理工具 (交互增强版)</title>
		<!-- Tailwind CSS -->
		<script src="https://cdn.tailwindcss.com"></script>
		<!-- Vue 3 -->
		<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
		<!-- SortableJS & Vue.Draggable -->
		<script src="https://unpkg.com/sortablejs@1.15.0/Sortable.min.js"></script>
		<script src="https://unpkg.com/vuedraggable@4.1.0/dist/vuedraggable.umd.min.js"></script>

		<style>
			::-webkit-scrollbar {
				width: 8px;
				height: 8px;
			}
			::-webkit-scrollbar-thumb {
				background: #cbd5e1;
				border-radius: 4px;
			}
			::-webkit-scrollbar-thumb:hover {
				background: #94a3b8;
			}
			.ghost-class {
				opacity: 0.5;
				background: #e2e8f0;
				border: 2px dashed #94a3b8;
			}
			.drag-class {
				opacity: 1;
				background: #fff;
			}
			.tree-line {
				border-left: 1px solid #e2e8f0;
			}

			/* 高亮闪烁动画 */
			@keyframes flash-highlight {
				0% {
					background-color: #fde047;
					transform: scale(1);
				}
				50% {
					background-color: #fef08a;
					transform: scale(1.02);
				}
				100% {
					background-color: white;
					transform: scale(1);
				}
			}
			.highlight-target {
				animation: flash-highlight 1.5s ease-out;
				border-color: #eab308 !important; /* Yellow-500 */
				box-shadow: 0 0 0 2px #fde047; /* Yellow-300 */
				z-index: 10;
			}
		</style>
	</head>
	<body class="bg-gray-100 h-screen flex flex-col overflow-hidden text-sm text-gray-700">
		<div id="app" class="flex flex-col h-full">
			<!-- 顶部工具栏 -->
			<header
				class="bg-white shadow p-3 flex items-center justify-between z-10 gap-4 flex-wrap border-b border-gray-200"
			>
				<div class="flex items-center space-x-3">
					<h1 class="text-lg font-bold text-gray-800">
						MC 物品分类器
						<span class="text-[10px] text-purple-600 font-normal">v4.0 Pro</span>
					</h1>

					<div class="relative group">
						<button
							class="px-3 py-1 bg-blue-50 text-blue-600 border border-blue-200 rounded hover:bg-blue-100 transition text-xs flex items-center gap-1"
						>
							📂 加载字典
						</button>
						<input
							type="file"
							@change="loadBedrockData"
							accept=".json"
							class="absolute inset-0 opacity-0 cursor-pointer"
							title="bedrock_data.json"
						/>
					</div>
				</div>

				<!-- 统计信息 -->
				<div
					class="flex items-center space-x-4 bg-gray-50 px-3 py-1 rounded-full border border-gray-200"
				>
					<div class="flex flex-col items-center leading-none">
						<span class="text-[10px] text-gray-400">覆盖率</span>
						<span
							class="font-bold"
							:class="uniqueCoverage === dictCount && dictCount > 0 ? 'text-green-600' : 'text-orange-600'"
						>
							{{ uniqueCoverage }}
							<span class="text-gray-400 font-normal">/ {{ dictCount }}</span>
						</span>
					</div>
				</div>

				<div class="flex items-center space-x-2">
					<div class="relative group">
						<button
							class="px-2 py-1 bg-gray-50 border border-gray-300 rounded hover:bg-gray-100 text-xs"
						>
							📥 导入
						</button>
						<input
							type="file"
							@change="importSmartFile"
							accept=".json,.txt,.jsonc"
							class="absolute inset-0 opacity-0 cursor-pointer"
						/>
					</div>
					<div class="flex bg-gray-100 rounded p-0.5 space-x-0.5">
						<button
							@click="exportProjectJson"
							class="px-2 py-1 bg-white hover:text-indigo-600 text-xs shadow-sm rounded"
						>
							工程
						</button>
						<button
							@click="exportJsonC"
							class="px-2 py-1 bg-indigo-600 text-white hover:bg-indigo-700 text-xs shadow-sm rounded"
						>
							JSONC
						</button>
						<button
							@click="exportIds"
							class="px-2 py-1 bg-teal-600 text-white hover:bg-teal-700 text-xs shadow-sm rounded"
						>
							ID
						</button>
					</div>
					<button
						@click="clearAll"
						class="px-2 py-1 bg-red-50 text-red-600 rounded hover:bg-red-100 border border-red-100 text-xs"
					>
						清空
					</button>
				</div>
			</header>

			<!-- 主体内容 -->
			<main class="flex-1 flex overflow-hidden">
				<!-- 左侧：物品源 -->
				<aside
					class="w-1/4 min-w-[280px] max-w-[400px] bg-white border-r border-gray-200 flex flex-col z-0"
				>
					<div class="p-2 border-b bg-gray-50">
						<input
							v-model="searchQuery"
							type="text"
							placeholder="搜索 ID 或名称..."
							class="w-full px-2 py-1.5 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
						/>
						<div class="mt-1 flex justify-between text-[10px] text-gray-400 px-1">
							<span
								>只显示未分类:
								<input type="checkbox" v-model="hideUsedItems" class="align-middle"
							/></span>
						</div>
					</div>
					<div class="flex-1 overflow-y-auto p-2">
						<draggable
							v-model="filteredSourceItems"
							:group="{ name: 'items', pull: 'clone', put: false }"
							:sort="false"
							:clone="cloneItem"
							item-key="id"
							class="space-y-1"
						>
							<template #item="{ element }">
								<div
									class="flex items-center p-1.5 bg-white border rounded cursor-move hover:border-blue-400 select-none group relative"
									@click="handleSourceClick(element.id)"
								>
									<!-- 已使用标记 (点击定位) -->
									<div
										v-if="usedIds.has(element.id)"
										class="absolute right-1 top-1 w-2 h-2 bg-green-400 rounded-full ring-2 ring-white cursor-pointer hover:scale-125 transition-transform"
										title="已分类 (点击定位)"
									></div>

									<div
										class="w-7 h-7 bg-gray-100 rounded flex items-center justify-center mr-2 text-[10px] text-gray-500 font-mono"
									>
										IMG
									</div>
									<div class="flex-1 overflow-hidden">
										<div class="font-medium truncate text-xs">
											{{ element.name }}
										</div>
										<div class="text-[10px] text-gray-400 truncate font-mono">
											{{ element.id }}
										</div>
									</div>
								</div>
							</template>
						</draggable>
						<div
							v-if="filteredSourceItems.length === 0"
							class="text-center text-gray-400 mt-10 text-xs"
						>
							{{ Object.keys(itemDict).length ? (hideUsedItems ? '未分类物品已空' :
							'无搜索结果') : '请先加载字典' }}
						</div>
					</div>
				</aside>

				<!-- 右侧：分类树 -->
				<section class="flex-1 bg-gray-50 flex flex-col min-w-0">
					<div
						class="p-2 border-b bg-white flex justify-between items-center shadow-sm z-10"
					>
						<div class="flex items-center gap-2">
							<h2 class="font-bold text-gray-700">分类结构</h2>
							<div class="flex bg-gray-100 rounded text-xs">
								<button
									@click="toggleAll(false)"
									class="px-2 py-0.5 hover:bg-gray-200 rounded-l border-r border-gray-300"
								>
									▼ 展开
								</button>
								<button
									@click="toggleAll(true)"
									class="px-2 py-0.5 hover:bg-gray-200 rounded-r"
								>
									▶ 收起
								</button>
							</div>
						</div>
						<button
							@click="addRootGroup"
							class="text-xs bg-green-50 text-green-700 border border-green-200 px-2 py-1 rounded hover:bg-green-100"
						>
							+ 新建根分组
						</button>
					</div>

					<div class="flex-1 overflow-y-auto p-4 custom-scroll" ref="treeContainer">
						<!-- 根节点入口 -->
						<nested-draggable
							:list="treeData"
							class="space-y-2 min-h-[200px] pb-20"
						></nested-draggable>
					</div>
				</section>
			</main>
		</div>

		<!-- 递归组件模板 -->
		<script type="text/x-template" id="nested-draggable-template">
			<draggable
			    :list="list"
			    :group="{ name: 'items' }"
			    item-key="uuid"
			    ghost-class="ghost-class"
			    drag-class="drag-class"
			    animation="150"
			    class="min-h-[5px]"
			    @change="onListChange"
			>
			    <template #item="{ element, index }">
			        <div class="relative group-container mb-1" :id="'node-' + element.uuid">
			            <!-- 分组渲染 -->
			            <div v-if="element.type === 'group'" class="border border-gray-300 rounded bg-white overflow-hidden shadow-sm">
			                <div class="flex items-center justify-between p-1.5 bg-gray-100 border-b border-gray-200 cursor-move group">
			                    <div class="flex items-center space-x-2 flex-1 min-w-0">
			                        <span class="cursor-pointer text-gray-500 w-4 text-center hover:bg-gray-200 rounded" @click="element.collapsed = !element.collapsed">
			                            {{ element.collapsed ? '▶' : '▼' }}
			                        </span>
			                        <span class="font-bold text-gray-700 select-none text-sm truncate" v-if="!element.editing" @dblclick="editGroup(element)">
			                            {{ element.name }}
			                        </span>
			                        <input v-else v-model="element.name" @blur="element.editing = false" @keyup.enter="element.editing = false" class="px-1 py-0 border rounded text-sm w-32" autoFocus>
			                        <span class="text-[10px] text-gray-400 bg-gray-200 px-1 rounded-full">{{ countItems(element) }}</span>
			                    </div>
			                    <div class="flex items-center opacity-0 group-hover:opacity-100 transition-opacity">
			                        <button @click="addSubGroup(element)" class="p-1 hover:bg-green-100 rounded text-green-600" title="添加子分组">➕</button>
			                        <button @click="removeNode(list, index)" class="p-1 hover:bg-red-100 rounded text-red-500 ml-1" title="删除">🗑️</button>
			                    </div>
			                </div>
			                <div v-show="!element.collapsed" class="p-1 bg-gray-50 min-h-[30px] pl-4 tree-line">
			                    <nested-draggable :list="element.children"></nested-draggable>
			                </div>
			            </div>

			            <!-- 物品渲染 -->
			            <div v-else
			                class="flex items-center p-1.5 bg-white border border-gray-200 rounded hover:border-blue-400 cursor-move shadow-sm group transition-all duration-300"
			                :class="{'highlight-target': element.uuid === highlightedUuid}"
			            >
			                <div class="flex-1 min-w-0 flex items-center">
			                    <div class="w-1 h-full bg-blue-500 rounded-l absolute left-0 top-0 bottom-0 opacity-0 group-hover:opacity-100"></div>
			                    <span class="text-[10px] text-gray-400 font-mono mr-2 w-5 text-right flex-shrink-0">ID</span>
			                    <div class="truncate text-sm text-gray-800 mr-2">{{ element.name || getDictName(element.id) }}</div>
			                    <div class="truncate text-[10px] text-gray-400 font-mono flex-1 text-right">{{ element.id }}</div>
			                </div>
			                <button @click="removeNode(list, index)" class="ml-2 text-gray-300 hover:text-red-500 px-1">×</button>
			            </div>
			        </div>
			    </template>
			</draggable>
		</script>

		<script>
			const { createApp, ref, computed, reactive, nextTick, inject } = Vue;
			const draggable = window.vuedraggable;

			// 递归组件
			const NestedDraggable = {
				template: "#nested-draggable-template",
				name: "nested-draggable",
				props: { list: { type: Array, required: true } },
				components: { draggable },
				setup(props) {
					const root = inject("rootState");

					const removeNode = (list, index) => {
						list.splice(index, 1);
					};

					const addSubGroup = (group) => {
						group.collapsed = false;
						group.children.push({
							uuid: crypto.randomUUID(),
							type: "group",
							name: "新分组",
							children: [],
							collapsed: false,
							editing: true,
						});
					};

					const editGroup = (group) => {
						group.editing = true;
					};

					// 监听拖拽变化，处理自动去重
					const onListChange = (evt) => {
						if (evt.added) {
							const addedItem = evt.added.element;
							if (addedItem.type === "item") {
								// 通知根组件清理此 ID 的旧副本
								root.handleItemAdd(addedItem);
							}
						}
					};

					const countItems = (group) => {
						let count = 0;
						if (!group.children) return 0;
						const recurse = (children) => {
							children.forEach((child) => {
								if (child.type === "item") count++;
								else if (child.type === "group") recurse(child.children);
							});
						};
						recurse(group.children);
						return count;
					};

					const getDictName = (id) => root.itemDict[id] || id;

					return {
						removeNode,
						addSubGroup,
						editGroup,
						countItems,
						getDictName,
						onListChange,
						highlightedUuid: computed(() => root.highlightedUuid.value),
					};
				},
			};

			const app = createApp({
				components: { draggable, NestedDraggable },
				setup() {
					const itemDict = reactive({});
					const treeData = ref([]);
					const searchQuery = ref("");
					const hideUsedItems = ref(false);
					const highlightedUuid = ref(null); // 当前高亮的节点 UUID
					
					// --- 自动从当前目录加载字典和工程文件 ---
					const tryLoadLocalFiles = async () => {
						// 加载字典 vanilla.json
						try {
							const resp = await fetch("./vanilla.json");
							if (resp.ok) {
								const data = await resp.json();
								const merged = {
									...(data.enums?.block || {}),
									...(data.enums?.item || {}),
								};
								for (const key in itemDict) delete itemDict[key];
								Object.assign(itemDict, merged);
								console.log(
									`[自动加载] 字典加载完成，共 ${Object.keys(itemDict).length} 个条目`
								);
							}
						} catch (_) {
							/* 静默失败，用户仍可手动加载 */
						}
						
						// 加载工程文件 project.json
						try {
							const resp = await fetch("./project.json");
							if (resp.ok) {
								const text = await resp.text();
								if (text.includes("\"children\":")) {
									treeData.value = JSON.parse(text);
									console.log(`[自动加载] 工程文件加载完成`);
								}
							}
						} catch (_) {
							/* 静默失败 */
						}
					};
					tryLoadLocalFiles();

					// 提供给子组件的方法
					const rootContext = {
						itemDict,
						highlightedUuid,
						// 处理新增物品时的去重逻辑
						handleItemAdd: (newItem) => {
							// 遍历整棵树，删除所有 ID 相同但 UUID 不同的节点
							// 这样保留了刚放进去的那个 (newItem)，删除了原来的
							const recursiveClean = (nodes) => {
								for (let i = nodes.length - 1; i >= 0; i--) {
									const node = nodes[i];
									if (node.type === "item") {
										// 如果 ID 相同，且 UUID 不是刚才拖进去那个，则删除
										if (node.id === newItem.id && node.uuid !== newItem.uuid) {
											nodes.splice(i, 1);
											// console.log("Removed duplicate:", node.id);
										}
									} else if (node.type === "group") {
										recursiveClean(node.children);
									}
								}
							};
							recursiveClean(treeData.value);
						},
					};
					Vue.provide("rootState", rootContext);

					// --- 统计与计算 ---
					const usedIds = computed(() => {
						const ids = new Set();
						const traverse = (nodes) => {
							nodes.forEach((node) => {
								if (node.type === "item") ids.add(node.id);
								else if (node.type === "group") traverse(node.children);
							});
						};
						traverse(treeData.value);
						return ids;
					});

					const dictCount = computed(() => Object.keys(itemDict).length);
					const uniqueCoverage = computed(() => {
						let count = 0;
						usedIds.value.forEach((id) => {
							if (itemDict[id]) count++;
						});
						return count;
					});

					// --- 交互核心逻辑 ---

					// 左侧点击事件：如果已分类，则定位
					const handleSourceClick = (id) => {
						if (usedIds.value.has(id)) {
							locateInTree(id);
						}
					};

					// 定位并高亮树中物品
					const locateInTree = async (targetId) => {
						// 1. 寻找路径
						let path = null;
						let targetUuid = null;

						const findPath = (nodes, currentPath) => {
							for (const node of nodes) {
								if (node.type === "item" && node.id === targetId) {
									targetUuid = node.uuid;
									return currentPath;
								} else if (node.type === "group") {
									const res = findPath(node.children, [...currentPath, node]);
									if (res) return res;
								}
							}
							return null;
						};

						path = findPath(treeData.value, []);

						if (path && targetUuid) {
							// 2. 展开路径上的所有分组
							path.forEach((group) => (group.collapsed = false));

							// 3. 等待 DOM 更新后滚动并高亮
							await nextTick();

							const el = document.getElementById("node-" + targetUuid);
							if (el) {
								el.scrollIntoView({ behavior: "smooth", block: "center" });
								highlightedUuid.value = targetUuid;
								// 1.5秒后移除高亮
								setTimeout(() => {
									if (highlightedUuid.value === targetUuid)
										highlightedUuid.value = null;
								}, 1500);
							}
						}
					};

					// 一键展开/收起
					const toggleAll = (collapse) => {
						const traverse = (nodes) => {
							nodes.forEach((node) => {
								if (node.type === "group") {
									node.collapsed = collapse;
									if (node.children) traverse(node.children);
								}
							});
						};
						traverse(treeData.value);
					};

					// 基础数据处理
					const loadBedrockData = (event) => {
						const file = event.target.files[0];
						if (!file) return;
						const reader = new FileReader();
						reader.onload = (e) => {
							try {
								const jsonStr = stripComments(e.target.result);
								const data = JSON.parse(jsonStr);
								const merged = {
									...(data.enums?.block || {}),
									...(data.enums?.item || {}),
								};
								for (const key in itemDict) delete itemDict[key];
								Object.assign(itemDict, merged);
							} catch (err) {
								alert("字典加载失败");
							}
						};
						reader.readAsText(file);
					};

					const filteredSourceItems = computed(() => {
						const query = searchQuery.value.toLowerCase().trim();
						const showAll = !query && Object.keys(itemDict).length > 200;
						if (showAll && !hideUsedItems.value) return [];
						const result = [];
						let count = 0;
						for (const [id, name] of Object.entries(itemDict)) {
							if (count > 50 && !query) break;
							if (hideUsedItems.value && usedIds.value.has(id)) continue;
							if (
								!query ||
								id.toLowerCase().includes(query) ||
								name.includes(query)
							) {
								result.push({ id, name });
								count++;
							}
						}
						return result;
					});

					const cloneItem = (item) => ({
						uuid: crypto.randomUUID(),
						type: "item",
						id: item.id,
						name: item.name,
					});
					const addRootGroup = () =>
						treeData.value.push({
							uuid: crypto.randomUUID(),
							type: "group",
							name: "新分组",
							children: [],
							collapsed: false,
							editing: true,
						});
					const clearAll = () => {
						if (confirm("确定清空吗？")) treeData.value = [];
					};
					const stripComments = (str) =>
						str.replace(/\/\*[\s\S]*?\*\/|([^\\:]|^)\/\/.*$/gm, "$1");

					// 导出导入逻辑 (保持不变，略微压缩)
					const download = (c, n, t) => {
						const a = document.createElement("a");
						a.href = URL.createObjectURL(new Blob([c], { type: t }));
						a.download = n;
						a.click();
					};
					const exportProjectJson = () =>
						download(
							JSON.stringify(treeData.value, null, 2),
							"project.json",
							"application/json"
						);
					const exportIds = () => {
						const ids = [];
						const t = (n) => {
							n.forEach((x) => {
								if (x.type === "item") ids.push(x.id);
								else if (x.type === "group") t(x.children);
							});
						};
						t(treeData.value);
						download(ids.join("\n"), "ids.txt", "text/plain");
					};
					const exportJsonC = () => {
						let l = ["[\n"];
						const t = (ns, d) => {
							const ind = "  ".repeat(d);
							ns.forEach((n) => {
								if (n.type === "group") {
									l.push(`\n${ind}// === ${n.name} ===`);
									if (n.children) t(n.children, d);
								} else {
									l.push(`${ind}"${n.id}",`);
								}
							});
						};
						t(treeData.value, 1);
						let s = l.join("\n");
						if (s.trim().endsWith(",")) s = s.trim().slice(0, -1);
						s += "\n]";
						download(s, "items.jsonc", "application/json");
					};
					const importSmartFile = (evt) => {
						const f = evt.target.files[0];
						if (!f) return;
						const r = new FileReader();
						r.onload = (e) => {
							try {
								const c = e.target.result;
								if (c.includes('"children":')) treeData.value = JSON.parse(c);
								else {
									const lines = c.split(/\r?\n/),
										root = [],
										def = {
											uuid: crypto.randomUUID(),
											type: "group",
											name: "Import",
											children: [],
											collapsed: false,
										};
									let cur = null;
									lines.forEach((line) => {
										const t = line.trim();
										if (!t) return;
										if (t.startsWith("//")) {
											cur = {
												uuid: crypto.randomUUID(),
												type: "group",
												name: t.replace(/^\/\/\s*|===/g, "").trim(),
												children: [],
												collapsed: false,
											};
											root.push(cur);
										} else if (t.includes('"') || t.includes("'")) {
											const m = t.match(/["']([^"']+)["']/);
											if (m && !["block", "item"].includes(m[1]))
												(cur || def).children.push({
													uuid: crypto.randomUUID(),
													type: "item",
													id: m[1],
													name: itemDict[m[1]] || m[1],
												});
										}
									});
									if (!root.length && def.children.length) root.push(def);
									treeData.value = root;
								}
							} catch (err) {
								alert("Error");
							}
						};
						r.readAsText(f);
					};

					return {
						itemDict,
						treeData,
						searchQuery,
						filteredSourceItems,
						hideUsedItems,
						highlightedUuid,
						loadBedrockData,
						cloneItem,
						addRootGroup,
						clearAll,
						exportProjectJson,
						exportIds,
						exportJsonC,
						importSmartFile,
						dictCount,
						uniqueCoverage,
						usedIds,
						toggleAll,
						handleSourceClick,
						rootContext,
					};
				},
			});

			app.mount("#app");
		</script>
	</body>
</html>
